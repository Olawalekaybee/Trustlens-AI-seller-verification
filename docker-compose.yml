services:
  backend:
    build: ./backend
    container_name: trustlens_backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    env_file:
      - ./backend/.env
    depends_on:
      - db

  db:
    image: postgres:15
    container_name: trustlens_db
    restart: always
    environment:
      POSTGRES_USER: trustlens_user
      POSTGRES_PASSWORD: trustlens_password
      POSTGRES_DB: trustlens_db
    ports:
      - "5432:5432"
    volumes:
      - trustlens_postgres_data:/var/lib/postgresql/data

volumes:
  trustlens_postgres_data: